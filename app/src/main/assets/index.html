<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OkTimer</title>
  <style>
    :root {
      --bg: #0b132b;
      --card: #162238;
      --card-border: #24344d;
      --accent: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.25);
      --text-main: #ffffff;
      --text-muted: #8899ac;
      --danger: #ff5252;
      --warn: #ffab00;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .app-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 18px;
    }
    .app-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .wake-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(16px); }

    /* Main Dial Card */
    .timer-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .progress-box {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .progress-svg {
      transform: rotate(-90deg);
      width: 250px;
      height: 250px;
    }
    .progress-bg {
      fill: none;
      stroke: #1c2b45;
      stroke-width: 10;
    }
    .progress-bar {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 691;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
    }
    .time-readout {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .digits {
      font-size: 2.8rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
    .sub-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Main Action Controls */
    .control-row {
      display: flex;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, filter 0.2s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: var(--accent);
      color: #0b132b;
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-pause {
      background: var(--warn);
      color: #0b132b;
    }
    .btn-secondary {
      background: #24344d;
      color: var(--text-main);
    }

    /* Quick Adjust Buttons */
    .adjust-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }
    .adj-btn {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .adj-btn:active {
      background: var(--accent);
      color: #0b132b;
    }

    /* Presets Section */
    .section-title {
      width: 100%;
      max-width: 420px;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
      text-align: left;
      padding-left: 4px;
    }
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 24px;
    }
    .preset-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 12px 8px;
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
    }
    .preset-card:active {
      border-color: var(--accent);
      background: #1e3150;
    }
    .preset-name {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .preset-time {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-title">&#9201; OkTimer</div>
    <label class="wake-toggle">
      <span>Awake</span>
      <span class="switch">
        <input type="checkbox" id="wakeLock" onchange="toggleWake(this)">
        <span class="slider"></span>
      </span>
    </label>
  </header>

  <div class="timer-card">
    <div class="progress-box">
      <svg class="progress-svg">
        <circle class="progress-bg" cx="125" cy="125" r="110"></circle>
        <circle class="progress-bar" id="progressBar" cx="125" cy="125" r="110"></circle>
      </svg>
      <div class="time-readout">
        <span class="digits" id="timeDisplay">05:00</span>
        <span class="sub-label" id="statusLabel">READY</span>
      </div>
    </div>

    <div class="control-row">
      <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
      <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">Start</button>
    </div>
  </div>

  <div class="adjust-grid">
    <button class="adj-btn" onclick="addSeconds(60)">+1 Min</button>
    <button class="adj-btn" onclick="addSeconds(300)">+5 Min</button>
    <button class="adj-btn" onclick="addSeconds(600)">+10 Min</button>
    <button class="adj-btn" onclick="addSeconds(-60)">-1 Min</button>
  </div>

  <div class="section-title">Quick Presets</div>
  <div class="preset-grid">
    <div class="preset-card" onclick="setPreset(60, '1 Minute')">
      <div class="preset-name">Quick</div>
      <div class="preset-time">1:00</div>
    </div>
    <div class="preset-card" onclick="setPreset(300, '5 Minutes')">
      <div class="preset-name">Short Break</div>
      <div class="preset-time">5:00</div>
    </div>
    <div class="preset-card" onclick="setPreset(600, '10 Minutes')">
      <div class="preset-name">Coffee</div>
      <div class="preset-time">10:00</div>
    </div>
    <div class="preset-card" onclick="setPreset(1500, 'Pomodoro')">
      <div class="preset-name">Pomodoro</div>
      <div class="preset-time">25:00</div>
    </div>
    <div class="preset-card" onclick="setPreset(2700, 'Deep Work')">
      <div class="preset-name">Deep Work</div>
      <div class="preset-time">45:00</div>
    </div>
    <div class="preset-card" onclick="setPreset(3600, 'Full Hour')">
      <div class="preset-name">Standard</div>
      <div class="preset-time">60:00</div>
    </div>
  </div>

  <script src="bridge.js"></script>
  <script>
    let totalSeconds = 300;
    let remainingSeconds = 300;
    let timerInterval = null;
    let isRunning = false;

    const CIRCUMFERENCE = 2 * Math.PI * 110;
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const startBtn = document.getElementById('startBtn');

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timeDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      const fraction = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      const offset = CIRCUMFERENCE * (1 - fraction);
      progressBar.style.strokeDashoffset = offset;
    }

    function toggleTimer() {
      if (typeof haptic === 'function') haptic('click');
      
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) remainingSeconds = totalSeconds;
      isRunning = true;
      statusLabel.textContent = "RUNNING";
      startBtn.textContent = "Pause";
      startBtn.className = "btn btn-pause";

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();
        } else {
          finishTimer();
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      statusLabel.textContent = "PAUSED";
      startBtn.textContent = "Resume";
      startBtn.className = "btn btn-primary";
    }

    function resetTimer() {
      if (typeof haptic === 'function') haptic('click');
      isRunning = false;
      clearInterval(timerInterval);
      remainingSeconds = totalSeconds;
      statusLabel.textContent = "READY";
      startBtn.textContent = "Start";
      startBtn.className = "btn btn-primary";
      updateDisplay();
    }

    function addSeconds(sec) {
      if (typeof haptic === 'function') haptic('click');
      totalSeconds = Math.max(10, totalSeconds + sec);
      remainingSeconds = Math.max(0, remainingSeconds + sec);
      updateDisplay();
    }

    function setPreset(sec, label) {
      if (typeof haptic === 'function') haptic('double');
      isRunning = false;
      clearInterval(timerInterval);
      totalSeconds = sec;
      remainingSeconds = sec;
      statusLabel.textContent = label.toUpperCase();
      startBtn.textContent = "Start";
      startBtn.className = "btn btn-primary";
      updateDisplay();
    }

    function finishTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      statusLabel.textContent = "COMPLETED";
      startBtn.textContent = "Start";
      startBtn.className = "btn btn-primary";

      if (typeof haptic === 'function') haptic('heavy');
      if (typeof sendNotification === 'function') {
        sendNotification("OkTimer", "Time is up! Your timer has completed.");
      }
      playAlertBeep();
    }

    function toggleWake(cb) {
      if (typeof setScreenAwake === 'function') {
        setScreenAwake(cb.checked);
      }
      if (typeof haptic === 'function') haptic('click');
    }

    function playAlertBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
      } catch(e) {}
    }

    updateDisplay();
  </script>
</body>
</html>
