<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3-OkTimer</title>
  <style>
    :root {
      --theme-color: #56c589;
      --theme-glow: rgba(86, 197, 137, 0.35);
      --bg-color: #080e18;
      --card-bg: #111a2e;
      --card-border: #1c2b45;
      --text-muted: rgba(255, 255, 255, 0.45);
      --danger: #ff5252;
      --warn: #ffab00;
      --rest-color: #38b6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      touch-action: none;
      padding: max(10px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    }

    /* Top Navigation Header */
    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      z-index: 10;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, transform 0.1s;
    }

    .icon-btn:active {
      color: #ffffff;
      transform: scale(0.92);
    }

    .pager-dots {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: transparent;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .dot.active {
      background: var(--theme-color);
      border-color: var(--theme-color);
      box-shadow: 0 0 10px var(--theme-color);
      transform: scale(1.35);
    }

    /* Main High-Visibility Dial Area */
    .timer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      max-width: 460px;
      position: relative;
    }

    .dial-wrapper {
      position: relative;
      width: min(88vw, 44vh);
      height: min(88vw, 44vh);
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }

    .dial-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .ring-bg {
      stroke: rgba(255, 255, 255, 0.07);
      stroke-width: 14;
      fill: transparent;
    }

    .ring-progress {
      stroke: var(--theme-color);
      stroke-width: 14;
      stroke-linecap: round;
      fill: transparent;
      stroke-dasharray: 816.81; /* 2 * PI * 130 */
      stroke-dashoffset: 0;
      filter: drop-shadow(0 0 10px var(--theme-glow));
      transition: stroke 0.3s;
    }

    .dial-handle {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--theme-color);
      box-shadow: 0 0 14px rgba(0, 0, 0, 0.9), 0 0 0 3px #ffffff;
      top: 0;
      left: 0;
      pointer-events: none;
      display: none;
      z-index: 5;
    }

    /* Center Content Inside Dial */
    .center-content {
      position: relative;
      width: 82%;
      height: 82%;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: auto;
    }

    .phase-badge {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
      transition: color 0.3s;
      text-align: center;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .exercise-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 2px;
      display: none;
      text-align: center;
      max-width: 190px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .round-indicator {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--warn);
      margin-bottom: 2px;
      display: none;
    }

    /* Giant Distance Digits */
    .time-digits {
      font-size: clamp(42px, 12vw, 62px);
      font-weight: 800;
      display: flex;
      align-items: baseline;
      letter-spacing: -1px;
      color: var(--theme-color);
      font-variant-numeric: tabular-nums;
    }

    .digit-group {
      cursor: pointer;
      display: inline-flex;
      align-items: baseline;
      padding: 2px 2px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    .digit-group.selected {
      color: var(--danger) !important;
      background: rgba(255, 82, 82, 0.15);
    }

    .time-unit {
      font-size: 14px;
      font-weight: 700;
      margin-left: 2px;
      margin-right: 4px;
      opacity: 0.55;
    }

    /* Dimmed, Low-Profile Start/Stop Button */
    .start-btn {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.3) !important;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      cursor: pointer;
      padding: 6px 22px;
      transition: all 0.2s ease;
    }

    .start-btn:active {
      color: rgba(255, 255, 255, 0.7) !important;
      background: rgba(255, 255, 255, 0.08);
      transform: scale(0.95);
    }

    /* HIIT Quick Info Bar (Timer 3) */
    .hiit-summary-row {
      display: none;
      width: 100%;
      max-width: 380px;
      justify-content: space-around;
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 10px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .summary-lbl {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .summary-val {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
    }

    /* Bottom Actions Row */
    .bottom-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: min(88vw, 360px);
      margin-top: 8px;
      z-index: 10;
    }

    .action-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: rgba(255, 255, 255, 0.65);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, border-color 0.2s, color 0.2s;
    }

    .action-btn:active {
      transform: scale(0.92);
      color: #ffffff;
      border-color: var(--theme-color);
    }

    .reset-icon {
      font-size: 18px;
    }

    /* Modals Backdrop */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
    }

    .modal-sheet {
      background: #101828;
      width: 100%;
      max-width: 440px;
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: none;
      max-height: 86vh;
      overflow-y: auto;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .tab-bar {
      display: flex;
      gap: 6px;
      background: #080e18;
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .tab-btn.active {
      background: #1e293b;
      color: #ffffff;
    }

    /* Circular Color Picker */
    .color-wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
    }

    #colorCanvas {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      touch-action: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      cursor: crosshair;
    }

    .lum-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lum-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(to right, #000000, var(--theme-color), #ffffff);
      outline: none;
    }

    .lum-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.8);
      border: 2px solid #000;
    }

    .color-preview-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #080e18;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .preview-capsule {
      width: 48px;
      height: 24px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.4);
      background: var(--theme-color);
    }

    .hex-badge {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    .modal-btn {
      flex: 1;
      padding: 12px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .modal-btn.primary {
      background: var(--theme-color);
      color: #080e18;
    }

    .modal-btn.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    /* Structured HIIT Workout Editor */
    .hiit-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 42vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .hiit-card {
      background: #080e18;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hiit-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-plain {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      width: 70%;
      padding: 2px;
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
    }

    .stepper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stepper-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stepper-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #1e293b;
      border: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-val {
      font-size: 14px;
      font-weight: 700;
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body id="appBody">

  <!-- Top Status & Navigation -->
  <div class="top-bar">
    <button class="icon-btn" onclick="openColorPicker(event)">🎨</button>
    <div class="pager-dots">
      <div class="dot active" onclick="switchTimer(0, event)"></div>
      <div class="dot" onclick="switchTimer(1, event)"></div>
      <div class="dot" onclick="switchTimer(2, event)"></div>
    </div>
    <button class="icon-btn" onclick="openSettings(event)">⚙️</button>
  </div>

  <!-- Timer Card -->
  <div class="timer-container">
    <div class="dial-wrapper" id="dialWrapper">
      <svg class="dial-svg" viewBox="0 0 300 300">
        <circle class="ring-bg" cx="150" cy="150" r="130" />
        <circle class="ring-progress" id="ringProgress" cx="150" cy="150" r="130" />
      </svg>
      
      <div class="dial-handle" id="dialHandle"></div>

      <div class="center-content">
        <div class="phase-badge" id="phaseBadge">TIMER 1</div>
        <div class="exercise-title" id="exerciseTitle">BURPEES</div>
        <div class="round-indicator" id="roundIndicator">EXERCISE 1/4 • ROUND 1/3</div>
        
        <div class="time-digits" id="timeDisplay">
          <div class="digit-group" id="grp-h" onclick="handleUnitClick('h', event)">
            <span id="txtH">0</span><span class="time-unit">H</span>
          </div>
          <div class="digit-group" id="grp-m" onclick="handleUnitClick('m', event)">
            <span id="txtM">01</span><span class="time-unit">M</span>
          </div>
          <div class="digit-group" id="grp-s" onclick="handleUnitClick('s', event)">
            <span id="txtS">00</span><span class="time-unit">S</span>
          </div>
        </div>
        <button class="start-btn" id="btnStart" onclick="handleStartStop(event)">Start</button>
      </div>
    </div>

    <!-- HIIT Quick Info Bar (Timer 3 Only) -->
    <div class="hiit-summary-row" id="hiitSummaryRow">
      <div class="summary-item">
        <span class="summary-lbl">Warm Up</span>
        <span class="summary-val" id="sumWarm">01:00</span>
      </div>
      <div class="summary-item">
        <span class="summary-lbl">Exercises</span>
        <span class="summary-val" id="sumExCount">4 Movements</span>
      </div>
      <div class="summary-item">
        <span class="summary-lbl">Rounds</span>
        <span class="summary-val" id="sumRounds">3 Sets</span>
      </div>
      <div class="summary-item">
        <span class="summary-lbl">Cool Down</span>
        <span class="summary-val" id="sumCool">01:00</span>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-actions">
      <button class="action-btn" id="btnPlus" onclick="handlePlusBumper(event)">+15s</button>
      <button class="action-btn" id="btnEditHiit" onclick="openHiitEditor(event)" style="display:none;">📝 Edit Plan</button>
      <button class="action-btn reset-icon" onclick="handleReset(event)">&#8635;</button>
    </div>
  </div>

  <!-- Color Picker Modal -->
  <div class="modal-overlay" id="colorModal" onclick="closeModal('colorModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">Color Customization</div>
      <div class="tab-bar">
        <button class="tab-btn active" id="tab0" onclick="selectColorTarget(0)">Timer 1</button>
        <button class="tab-btn" id="tab1" onclick="selectColorTarget(1)">Timer 2</button>
        <button class="tab-btn" id="tab2" onclick="selectColorTarget(2)">HIIT Engine</button>
      </div>

      <div class="color-wheel-container">
        <canvas id="colorCanvas" width="210" height="210"></canvas>
        <div class="lum-container">
          <label class="stepper-label">Luminance / Brightness</label>
          <input type="range" class="lum-slider" id="lumSlider" min="0.1" max="1" step="0.01" value="0.9" oninput="updateLuminance(this.value)">
        </div>
      </div>

      <div class="color-preview-bar">
        <span class="stepper-label">Preview</span>
        <div class="preview-capsule" id="previewCapsule"></div>
        <span class="hex-badge" id="hexBadge">#56C589</span>
      </div>

      <div class="modal-actions">
        <button class="modal-btn secondary" onclick="closeModal('colorModal')">Done</button>
        <button class="modal-btn primary" onclick="applyColorChoice()">Apply</button>
      </div>
    </div>
  </div>

  <!-- HIIT Workout Plan Editor Modal -->
  <div class="modal-overlay" id="hiitModal" onclick="closeModal('hiitModal')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-title">HIIT Workout Blocks</div>

      <div class="stepper-row">
        <span class="stepper-label">Warm Up Phase</span>
        <div class="stepper-ctrl">
          <button class="step-btn" onclick="adjustHiitGlobal('warmUpSec', -15)">-</button>
          <span class="step-val" id="edWarmVal">01:00</span>
          <button class="step-btn" onclick="adjustHiitGlobal('warmUpSec', 15)">+</button>
        </div>
      </div>

      <div class="stepper-row">
        <span class="stepper-label">Total Rounds / Sets</span>
        <div class="stepper-ctrl">
          <button class="step-btn" onclick="adjustHiitGlobal('totalRounds', -1)">-</button>
          <span class="step-val" id="edRoundsVal">3</span>
          <button class="step-btn" onclick="adjustHiitGlobal('totalRounds', 1)">+</button>
        </div>
      </div>

      <div class="stepper-row">
        <span class="stepper-label">Cool Down Phase</span>
        <div class="stepper-ctrl">
          <button class="step-btn" onclick="adjustHiitGlobal('coolDownSec', -15)">-</button>
          <span class="step-val" id="edCoolVal">01:00</span>
          <button class="step-btn" onclick="adjustHiitGlobal('coolDownSec', 15)">+</button>
        </div>
      </div>

      <div class="stepper-label" style="margin-top: 4px;">Exercise Blocks</div>
      <div class="hiit-list" id="hiitExerciseList"></div>

      <button class="modal-btn secondary" onclick="addNewExercise()">+ Add Movement Block</button>

      <div class="modal-actions">
        <button class="modal-btn primary" onclick="saveHiitPlan()">Save & Apply Plan</button>
      </div>
    </div>
  </div>

  <script>
    // Universal Bridge Fallbacks for Web Preview & Native App
    window.haptic = window.haptic || function(type) {
      if (window.AndroidInterface && window.AndroidInterface.triggerVibrate) {
        window.AndroidInterface.triggerVibrate(type);
      } else if (navigator.vibrate) {
        if (type === 'click') navigator.vibrate(25);
        else if (type === 'double') navigator.vibrate([40, 60, 40]);
        else if (type === 'heavy') navigator.vibrate(200);
      }
    };

    window.playNativeAlarm = window.playNativeAlarm || function() {
      if (window.AndroidInterface && window.AndroidInterface.playNativeAlarm) {
        window.AndroidInterface.playNativeAlarm();
      } else {
        playWebTone(880, 0.4);
        setTimeout(() => playWebTone(880, 0.4), 450);
        setTimeout(() => playWebTone(880, 0.8), 900);
      }
    };

    window.stopNativeAlarm = window.stopNativeAlarm || function() {
      if (window.AndroidInterface && window.AndroidInterface.stopNativeAlarm) {
        window.AndroidInterface.stopNativeAlarm();
      }
    };

    window.playNativeBeep = window.playNativeBeep || function(type) {
      if (window.AndroidInterface && window.AndroidInterface.playNativeBeep) {
        window.AndroidInterface.playNativeBeep(type);
      } else {
        if (type === 'warning') playWebTone(540, 0.12);
        else if (type === 'transition') playWebTone(880, 0.35);
        else playWebTone(440, 0.08);
      }
    };

    window.acquireWakeLock = window.acquireWakeLock || function() {
      if (window.AndroidInterface && window.AndroidInterface.acquireWakeLock) {
        window.AndroidInterface.acquireWakeLock();
      }
    };

    window.releaseWakeLock = window.releaseWakeLock || function() {
      if (window.AndroidInterface && window.AndroidInterface.releaseWakeLock) {
        window.AndroidInterface.releaseWakeLock();
      }
    };

    window.sendNotification = window.sendNotification || function(title, msg) {
      if (window.AndroidInterface && window.AndroidInterface.triggerNotification) {
        window.AndroidInterface.triggerNotification(title, msg);
      }
    };

    function playWebTone(freq, dur) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch(e) {}
    }

    const RADIUS = 130;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS;
    const STORAGE_KEY = 'ok_multitimer_master_v5';

    const defaultTimers = [
      { name: 'Timer 1', color: '#56c589', h: 0, m: 1, s: 0, totalSec: 60, currentSec: 60, isRunning: false, endTime: 0 },
      { name: 'Timer 2', color: '#38b6ff', h: 4, m: 0, s: 0, totalSec: 14400, currentSec: 14400, isRunning: false, endTime: 0 },
      { 
        name: 'HIIT Workout', 
        color: '#a855f7', 
        isHiit: true,
        warmUpSec: 60,
        coolDownSec: 60,
        totalRounds: 3,
        currentRound: 1,
        currentExIdx: 0,
        phase: 'idle',
        currentSec: 60,
        isRunning: false,
        endTime: 0,
        exercises: [
          { name: 'Burpees', workSec: 40, restSec: 20 },
          { name: 'Jump Squats', workSec: 40, restSec: 20 },
          { name: 'Push Ups', workSec: 40, restSec: 20 },
          { name: 'Plank Hold', workSec: 45, restSec: 15 }
        ]
      }
    ];

    let timers = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultTimers;
    let currentTimerIdx = 0;
    let activeUnit = null;
    let isDraggingDial = false;
    let colorTargetIdx = 0;
    let currentHue = 140;
    let currentSat = 0.8;
    let currentLum = 0.85;

    const dialWrapper = document.getElementById('dialWrapper');
    const ringProgress = document.getElementById('ringProgress');
    const dialHandle = document.getElementById('dialHandle');
    const phaseBadge = document.getElementById('phaseBadge');
    const exerciseTitle = document.getElementById('exerciseTitle');
    const roundIndicator = document.getElementById('roundIndicator');
    const hiitSummaryRow = document.getElementById('hiitSummaryRow');
    const txtH = document.getElementById('txtH');
    const txtM = document.getElementById('txtM');
    const txtS = document.getElementById('txtS');
    const grpH = document.getElementById('grp-h');
    const grpM = document.getElementById('grp-m');
    const grpS = document.getElementById('grp-s');
    const btnStart = document.getElementById('btnStart');
    const btnPlus = document.getElementById('btnPlus');
    const btnEditHiit = document.getElementById('btnEditHiit');
    const dots = document.querySelectorAll('.dot');
    const colorCanvas = document.getElementById('colorCanvas');
    const previewCapsule = document.getElementById('previewCapsule');
    const hexBadge = document.getElementById('hexBadge');
    const lumSlider = document.getElementById('lumSlider');

    ringProgress.style.strokeDasharray = `${CIRCUMFERENCE} ${CIRCUMFERENCE}`;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timers));
    }

    setInterval(() => {
      const now = Date.now();
      let stateChanged = false;

      timers.forEach((t) => {
        if (!t.isRunning) return;

        if (t.isHiit) {
          const diff = Math.max(0, Math.ceil((t.endTime - now) / 1000));
          if (diff !== t.currentSec) {
            t.currentSec = diff;
            stateChanged = true;

            if (t.currentSec <= 3 && t.currentSec > 0) {
              window.playNativeBeep('warning');
              window.haptic('click');
            }

            if (t.currentSec <= 0) {
              handleHiitStep(t);
            }
          }
        } else {
          const diff = Math.max(0, Math.ceil((t.endTime - now) / 1000));
          if (diff !== t.currentSec) {
            t.currentSec = diff;
            t.h = Math.floor(t.currentSec / 3600);
            t.m = Math.floor((t.currentSec % 3600) / 60);
            t.s = t.currentSec % 60;
            stateChanged = true;

            if (t.currentSec <= 0) {
              t.isRunning = false;
              t.currentSec = 0;
              window.releaseWakeLock();
              window.playNativeAlarm();
              window.sendNotification(t.name, "Timer completed!");
              window.haptic('heavy');
            }
          }
        }
      });

      if (stateChanged) {
        render();
        saveState();
      }
    }, 200);

    function handleHiitStep(t) {
      if (t.phase === 'warmup') {
        t.phase = 'work';
        t.currentRound = 1;
        t.currentExIdx = 0;
        const curEx = t.exercises[0];
        t.currentSec = curEx.workSec;
        t.endTime = Date.now() + (curEx.workSec * 1000);
        window.playNativeBeep('transition');
        window.haptic('double');
      } else if (t.phase === 'work') {
        const curEx = t.exercises[t.currentExIdx];
        if (curEx.restSec > 0) {
          t.phase = 'rest';
          t.currentSec = curEx.restSec;
          t.endTime = Date.now() + (curEx.restSec * 1000);
          window.playNativeBeep('transition');
          window.haptic('double');
        } else {
          advanceHiitMovement(t);
        }
      } else if (t.phase === 'rest') {
        advanceHiitMovement(t);
      } else if (t.phase === 'cooldown') {
        t.isRunning = false;
        t.phase = 'idle';
        t.currentRound = 1;
        t.currentExIdx = 0;
        t.currentSec = t.warmUpSec > 0 ? t.warmUpSec : t.exercises[0].workSec;
        window.releaseWakeLock();
        window.playNativeAlarm();
        window.sendNotification("Workout Complete!", "You finished all exercise blocks!");
        window.haptic('heavy');
      }
    }

    function advanceHiitMovement(t) {
      if (t.currentExIdx < t.exercises.length - 1) {
        t.currentExIdx++;
        t.phase = 'work';
        const nextEx = t.exercises[t.currentExIdx];
        t.currentSec = nextEx.workSec;
        t.endTime = Date.now() + (nextEx.workSec * 1000);
        window.playNativeBeep('transition');
        window.haptic('double');
      } else {
        if (t.currentRound < t.totalRounds) {
          t.currentRound++;
          t.currentExIdx = 0;
          t.phase = 'work';
          const firstEx = t.exercises[0];
          t.currentSec = firstEx.workSec;
          t.endTime = Date.now() + (firstEx.workSec * 1000);
          window.playNativeBeep('transition');
          window.haptic('double');
        } else {
          if (t.coolDownSec > 0) {
            t.phase = 'cooldown';
            t.currentSec = t.coolDownSec;
            t.endTime = Date.now() + (t.coolDownSec * 1000);
            window.playNativeBeep('transition');
            window.haptic('double');
          } else {
            t.isRunning = false;
            t.phase = 'idle';
            t.currentRound = 1;
            t.currentExIdx = 0;
            t.currentSec = t.warmUpSec > 0 ? t.warmUpSec : t.exercises[0].workSec;
            window.releaseWakeLock();
            window.playNativeAlarm();
            window.sendNotification("Workout Complete!", "You finished all rounds!");
            window.haptic('heavy');
          }
        }
      }
    }

    function updateTheme() {
      const cur = timers[currentTimerIdx];
      document.documentElement.style.setProperty('--theme-color', cur.color);
      document.documentElement.style.setProperty('--theme-glow', cur.color + '55');

      dots.forEach((dot, idx) => dot.classList.toggle('active', idx === currentTimerIdx));

      if (cur.isHiit) {
        hiitSummaryRow.style.display = 'flex';
        exerciseTitle.style.display = 'block';
        roundIndicator.style.display = 'block';
        grpH.style.display = 'none';
        btnEditHiit.style.display = 'flex';
        btnPlus.style.display = 'none';
        updateHiitSummaryText();
      } else {
        hiitSummaryRow.style.display = 'none';
        exerciseTitle.style.display = 'none';
        roundIndicator.style.display = 'none';
        grpH.style.display = 'inline-flex';
        btnEditHiit.style.display = 'none';
        btnPlus.style.display = 'flex';
        btnPlus.textContent = '+15s';
        phaseBadge.textContent = cur.name || `TIMER ${currentTimerIdx + 1}`;
      }
      render();
    }

    function updateHiitSummaryText() {
      const cur = timers[2];
      document.getElementById('sumWarm').textContent = formatSeconds(cur.warmUpSec);
      document.getElementById('sumExCount').textContent = `${cur.exercises.length} Blocks`;
      document.getElementById('sumRounds').textContent = `${cur.totalRounds} Sets`;
      document.getElementById('sumCool').textContent = formatSeconds(cur.coolDownSec);
    }

    function render() {
      const cur = timers[currentTimerIdx];
      btnStart.textContent = cur.isRunning ? "Stop" : "Start";

      if (cur.isHiit) {
        const ex = cur.exercises[cur.currentExIdx] || cur.exercises[0];
        roundIndicator.textContent = `BLOCK ${cur.currentExIdx + 1}/${cur.exercises.length} • SET ${cur.currentRound}/${cur.totalRounds}`;
        
        let totalPhaseSec = 60;
        if (cur.phase === 'warmup') {
          phaseBadge.textContent = "🔥 WARM UP";
          phaseBadge.style.color = "var(--warn)";
          exerciseTitle.textContent = "GET READY";
          totalPhaseSec = cur.warmUpSec;
          ringProgress.style.stroke = "var(--warn)";
        } else if (cur.phase === 'work') {
          phaseBadge.textContent = "⚡ WORK INTERVAL";
          phaseBadge.style.color = cur.color;
          exerciseTitle.textContent = ex.name;
          totalPhaseSec = ex.workSec;
          ringProgress.style.stroke = cur.color;
        } else if (cur.phase === 'rest') {
          phaseBadge.textContent = "🧘 REST INTERVAL";
          phaseBadge.style.color = "var(--rest-color)";
          const nextExName = cur.exercises[cur.currentExIdx + 1]?.name || cur.exercises[0]?.name;
          exerciseTitle.textContent = `NEXT: ${nextExName}`;
          totalPhaseSec = ex.restSec;
          ringProgress.style.stroke = "var(--rest-color)";
        } else if (cur.phase === 'cooldown') {
          phaseBadge.textContent = "❄️ COOL DOWN";
          phaseBadge.style.color = "var(--rest-color)";
          exerciseTitle.textContent = "RECOVERY";
          totalPhaseSec = cur.coolDownSec;
          ringProgress.style.stroke = "var(--rest-color)";
        } else {
          phaseBadge.textContent = "READY TO START";
          phaseBadge.style.color = "var(--text-muted)";
          exerciseTitle.textContent = ex.name;
          totalPhaseSec = cur.warmUpSec > 0 ? cur.warmUpSec : ex.workSec;
          ringProgress.style.stroke = cur.color;
        }

        const m = Math.floor(cur.currentSec / 60);
        const s = cur.currentSec % 60;
        txtM.textContent = String(m).padStart(2, '0');
        txtS.textContent = String(s).padStart(2, '0');

        grpH.classList.remove('selected');
        grpM.classList.toggle('selected', activeUnit === 'm');
        grpS.classList.toggle('selected', activeUnit === 's');

        const fraction = totalPhaseSec > 0 ? (cur.currentSec / totalPhaseSec) : 0;
        ringProgress.style.strokeDashoffset = CIRCUMFERENCE - (fraction * CIRCUMFERENCE);
        dialHandle.style.display = 'none';
      } else {
        phaseBadge.style.color = "var(--text-muted)";
        txtH.textContent = cur.h;
        txtM.textContent = String(cur.m).padStart(2, '0');
        txtS.textContent = String(cur.s).padStart(2, '0');

        grpH.classList.toggle('selected', activeUnit === 'h');
        grpM.classList.toggle('selected', activeUnit === 'm');
        grpS.classList.toggle('selected', activeUnit === 's');

        ringProgress.style.stroke = cur.color;

        if (activeUnit) {
          dialHandle.style.display = 'block';
          let fraction = 0;
          if (activeUnit === 'h') fraction = cur.h / 12;
          else if (activeUnit === 'm') fraction = cur.m / 60;
          else if (activeUnit === 's') fraction = cur.s / 60;

          fraction = Math.min(Math.max(fraction, 0), 1);
          ringProgress.style.strokeDashoffset = CIRCUMFERENCE - (fraction * CIRCUMFERENCE);

          const rect = dialWrapper.getBoundingClientRect();
          const dialRadius = rect.width / 2;
          const knobRadius = dialRadius * (RADIUS / 150);
          const angle = fraction * 2 * Math.PI - (Math.PI / 2);
          
          const x = dialRadius + knobRadius * Math.cos(angle) - 13;
          const y = dialRadius + knobRadius * Math.sin(angle) - 13;
          dialHandle.style.left = `${x}px`;
          dialHandle.style.top = `${y}px`;
        } else {
          dialHandle.style.display = 'none';
          const fraction = cur.totalSec > 0 ? (cur.currentSec / cur.totalSec) : 0;
          ringProgress.style.strokeDashoffset = CIRCUMFERENCE - (fraction * CIRCUMFERENCE);
        }
      }
    }

    function formatSeconds(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function handleUnitClick(unit, e) {
      e.stopPropagation();
      const cur = timers[currentTimerIdx];
      if (cur.isHiit) return;
      if (cur.isRunning) pauseTimer();
      activeUnit = (activeUnit === unit) ? null : unit;
      window.haptic('click');
      render();
    }

    document.getElementById('appBody').addEventListener('click', () => {
      if (activeUnit) commitValues();
    });

    function commitValues() {
      const cur = timers[currentTimerIdx];
      activeUnit = null;
      if (!cur.isHiit) {
        cur.totalSec = (cur.h * 3600) + (cur.m * 60) + cur.s;
        cur.currentSec = cur.totalSec;
      }
      saveState();
      render();
    }

    function getAngle(e) {
      const rect = dialWrapper.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let angle = Math.atan2(clientY - cy, clientX - cx) * (180 / Math.PI) + 90;
      if (angle < 0) angle += 360;
      return angle;
    }

    function checkTouchOnRing(e) {
      const rect = dialWrapper.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dist = Math.hypot(clientX - cx, clientY - cy);
      const r = rect.width / 2;
      return dist >= r * 0.55 && dist <= r * 1.2;
    }

    dialWrapper.addEventListener('pointerdown', (e) => {
      if (!activeUnit) return;
      if (checkTouchOnRing(e)) {
        isDraggingDial = true;
        updateValueFromAngle(getAngle(e));
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDraggingDial || !activeUnit) return;
      updateValueFromAngle(getAngle(e));
    });

    window.addEventListener('pointerup', () => {
      if (isDraggingDial) {
        isDraggingDial = false;
        commitValues();
      }
    });

    function updateValueFromAngle(angle) {
      if (!activeUnit) return;
      const cur = timers[currentTimerIdx];
      const fraction = angle / 360;

      if (!cur.isHiit) {
        if (activeUnit === 'h') cur.h = Math.min(12, Math.round(fraction * 12));
        else if (activeUnit === 'm') cur.m = Math.min(59, Math.round(fraction * 60));
        else if (activeUnit === 's') cur.s = Math.min(59, Math.round(fraction * 60));
      }
      window.haptic('click');
      render();
    }

    function handleStartStop(e) {
      e.stopPropagation();
      const cur = timers[currentTimerIdx];
      if (activeUnit) commitValues();

      if (cur.isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      const cur = timers[currentTimerIdx];
      window.stopNativeAlarm();

      if (cur.isHiit) {
        cur.isRunning = true;
        if (cur.phase === 'idle') {
          if (cur.warmUpSec > 0) {
            cur.phase = 'warmup';
            cur.currentSec = cur.warmUpSec;
          } else {
            cur.phase = 'work';
            cur.currentRound = 1;
            cur.currentExIdx = 0;
            cur.currentSec = cur.exercises[0].workSec;
          }
        }
        cur.endTime = Date.now() + (cur.currentSec * 1000);
      } else {
        if (cur.currentSec <= 0) return;
        cur.isRunning = true;
        cur.endTime = Date.now() + (cur.currentSec * 1000);
      }

      window.acquireWakeLock();
      window.haptic('click');
      saveState();
      render();
    }

    function pauseTimer() {
      const cur = timers[currentTimerIdx];
      cur.isRunning = false;
      window.releaseWakeLock();
      window.haptic('click');
      saveState();
      render();
    }

    function handleReset(e) {
      e.stopPropagation();
      const cur = timers[currentTimerIdx];
      cur.isRunning = false;
      activeUnit = null;
      window.releaseWakeLock();
      window.stopNativeAlarm();

      if (cur.isHiit) {
        cur.phase = 'idle';
        cur.currentRound = 1;
        cur.currentExIdx = 0;
        cur.currentSec = cur.warmUpSec > 0 ? cur.warmUpSec : cur.exercises[0].workSec;
      } else {
        cur.currentSec = cur.totalSec;
        cur.h = Math.floor(cur.totalSec / 3600);
        cur.m = Math.floor((cur.totalSec % 3600) / 60);
        cur.s = cur.totalSec % 60;
      }
      window.haptic('click');
      saveState();
      render();
    }

    function handlePlusBumper(e) {
      e.stopPropagation();
      const cur = timers[currentTimerIdx];
      window.haptic('click');

      cur.currentSec += 15;
      if (cur.currentSec > cur.totalSec) cur.totalSec = cur.currentSec;
      cur.h = Math.floor(cur.currentSec / 3600);
      cur.m = Math.floor((cur.currentSec % 3600) / 60);
      cur.s = cur.totalSec % 60;
      if (cur.isRunning) cur.endTime = Date.now() + (cur.currentSec * 1000);
      saveState();
      render();
    }

    function switchTimer(idx, e) {
      if (e) e.stopPropagation();
      if (currentTimerIdx === idx) return;
      activeUnit = null;
      currentTimerIdx = idx;
      window.haptic('click');
      updateTheme();
    }

    // Outer Screen Swipe Gestures
    let touchStartX = 0;
    let touchStartY = 0;
    let validSwipe = false;

    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#dialWrapper') || e.target.closest('.bottom-actions') || e.target.closest('.modal-sheet') || e.target.closest('.hiit-summary-row')) {
        validSwipe = false;
        return;
      }
      validSwipe = true;
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (!validSwipe || isDraggingDial) return;
      const diffX = touchStartX - e.changedTouches[0].screenX;
      const diffY = touchStartY - e.changedTouches[0].screenY;
      if (Math.abs(diffX) > 80 && Math.abs(diffX) > Math.abs(diffY) * 1.8) {
        if (diffX > 0 && currentTimerIdx < 2) switchTimer(currentTimerIdx + 1);
        else if (diffX < 0 && currentTimerIdx > 0) switchTimer(currentTimerIdx - 1);
      }
    }, { passive: true });

    // Modals Handling
    function openModal(id) {
      const modal = document.getElementById(id);
      modal.style.display = 'flex';
      window.activeModal = modal;
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.style.display = 'none';
      if (window.activeModal === modal) window.activeModal = null;
    }

    // Circular Spectrum Color Picker Engine
    function openColorPicker(e) {
      if (e) e.stopPropagation();
      selectColorTarget(currentTimerIdx);
      drawColorWheel();
      openModal('colorModal');
    }

    function selectColorTarget(idx) {
      colorTargetIdx = idx;
      ['tab0', 'tab1', 'tab2'].forEach((t, i) => {
        document.getElementById(t).classList.toggle('active', i === idx);
      });
      const hex = timers[idx].color;
      updatePreview(hex);
    }

    function drawColorWheel() {
      const ctx = colorCanvas.getContext('2d');
      const width = colorCanvas.width;
      const radius = width / 2;
      const imgData = ctx.createImageData(width, width);
      const data = imgData.data;

      for (let y = 0; y < width; y++) {
        for (let x = 0; x < width; x++) {
          const dx = x - radius;
          const dy = y - radius;
          const dist = Math.hypot(dx, dy);
          const idx = (y * width + x) * 4;

          if (dist <= radius) {
            let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 180;
            const sat = dist / radius;
            const rgb = hsvToRgb(angle, sat, currentLum);
            data[idx] = rgb[0];
            data[idx + 1] = rgb[1];
            data[idx + 2] = rgb[2];
            data[idx + 3] = 255;
          } else {
            data[idx + 3] = 0;
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function handleColorTouch(e) {
      const rect = colorCanvas.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.hypot(dx, dy);
      const radius = rect.width / 2;

      if (dist <= radius) {
        currentHue = Math.atan2(dy, dx) * (180 / Math.PI) + 180;
        currentSat = Math.min(1, dist / radius);
        const rgb = hsvToRgb(currentHue, currentSat, currentLum);
        const hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
        updatePreview(hex);
      }
    }

    colorCanvas.addEventListener('pointerdown', (e) => {
      handleColorTouch(e);
      window.addEventListener('pointermove', handleColorTouch);
    });

    window.addEventListener('pointerup', () => {
      window.removeEventListener('pointermove', handleColorTouch);
    });

    function updateLuminance(val) {
      currentLum = parseFloat(val);
      drawColorWheel();
      const rgb = hsvToRgb(currentHue, currentSat, currentLum);
      const hex = rgbToHex(rgb[0], rgb[1], rgb[2]);
      updatePreview(hex);
    }

    function updatePreview(hex) {
      previewCapsule.style.background = hex;
      hexBadge.textContent = hex.toUpperCase();
    }

    function applyColorChoice() {
      timers[colorTargetIdx].color = hexBadge.textContent;
      saveState();
      updateTheme();
      closeModal('colorModal');
    }

    function hsvToRgb(h, s, v) {
      let f = (n, k = (n + h / 60) % 6) => v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
      return [Math.round(f(5) * 255), Math.round(f(3) * 255), Math.round(f(1) * 255)];
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    // HIIT Block Editor Logic
    function openHiitEditor(e) {
      if (e) e.stopPropagation();
      renderHiitEditor();
      openModal('hiitModal');
    }

    function renderHiitEditor() {
      const cur = timers[2];
      document.getElementById('edWarmVal').textContent = formatSeconds(cur.warmUpSec);
      document.getElementById('edRoundsVal').textContent = cur.totalRounds;
      document.getElementById('edCoolVal').textContent = formatSeconds(cur.coolDownSec);

      const listContainer = document.getElementById('hiitExerciseList');
      listContainer.innerHTML = '';

      cur.exercises.forEach((ex, idx) => {
        const card = document.createElement('div');
        card.className = 'hiit-card';
        card.innerHTML = `
          <div class="hiit-card-head">
            <input type="text" class="input-plain" value="${ex.name}" onchange="updateExName(${idx}, this.value)" placeholder="Exercise Name">
            <button class="btn-del" onclick="deleteExercise(${idx})">✕</button>
          </div>
          <div class="stepper-row">
            <span class="stepper-label">Work Time</span>
            <div class="stepper-ctrl">
              <button class="step-btn" onclick="adjustExWork(${idx}, -5)">-</button>
              <span class="step-val">${formatSeconds(ex.workSec)}</span>
              <button class="step-btn" onclick="adjustExWork(${idx}, 5)">+</button>
            </div>
          </div>
          <div class="stepper-row">
            <span class="stepper-label">Rest Time</span>
            <div class="stepper-ctrl">
              <button class="step-btn" onclick="adjustExRest(${idx}, -5)">-</button>
              <span class="step-val">${formatSeconds(ex.restSec)}</span>
              <button class="step-btn" onclick="adjustExRest(${idx}, 5)">+</button>
            </div>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function adjustHiitGlobal(field, delta) {
      const cur = timers[2];
      if (field === 'totalRounds') {
        cur.totalRounds = Math.max(1, Math.min(99, cur.totalRounds + delta));
      } else {
        cur[field] = Math.max(0, cur[field] + delta);
      }
      renderHiitEditor();
    }

    function updateExName(idx, val) {
      timers[2].exercises[idx].name = val.trim() || `Movement ${idx + 1}`;
    }

    function adjustExWork(idx, delta) {
      const ex = timers[2].exercises[idx];
      ex.workSec = Math.max(5, ex.workSec + delta);
      renderHiitEditor();
    }

    function adjustExRest(idx, delta) {
      const ex = timers[2].exercises[idx];
      ex.restSec = Math.max(0, ex.restSec + delta);
      renderHiitEditor();
    }

    function addNewExercise() {
      timers[2].exercises.push({
        name: `Movement ${timers[2].exercises.length + 1}`,
        workSec: 40,
        restSec: 20
      });
      renderHiitEditor();
    }

    function deleteExercise(idx) {
      if (timers[2].exercises.length <= 1) return;
      timers[2].exercises.splice(idx, 1);
      renderHiitEditor();
    }

    function saveHiitPlan() {
      const cur = timers[2];
      cur.phase = 'idle';
      cur.currentRound = 1;
      cur.currentExIdx = 0;
      cur.currentSec = cur.warmUpSec > 0 ? cur.warmUpSec : cur.exercises[0].workSec;
      saveState();
      updateTheme();
      closeModal('hiitModal');
    }

    function openSettings(e) {
      openHiitEditor(e);
    }

    updateTheme();
  </script>
</body>
</html>
